name: Build + push onetake-seo-ai

# Builds the production image for Azure Container Apps and pushes to
# novacert.azurecr.io. Mirrors the centric-intake onetake-worker workflow.
#
# Required GitHub repo secrets:
#   ACR_USERNAME        — admin user on novacert ACR
#   ACR_PASSWORD        — admin password
# Optional:
#   AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
#     — for the optional ACA revision restart step (see bottom). When unset,
#       the job stops after the push and Pengfei (or the ACR webhook) flips
#       the revision.

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'Dockerfile.aca'
      - '.dockerignore'
      - '.github/workflows/deploy-aca.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-aca-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: novacert.azurecr.io
  IMAGE: onetake-seo-ai

jobs:
  build:
    name: Build + push to ACR
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build + push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.aca
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: echo "Pushed ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}"

  # Optional — only runs when Azure OIDC creds are configured. When the
  # ACR webhook is wired up on the container app, ACA pulls the new image
  # automatically and this step is unnecessary.
  restart-revision:
    name: Restart ACA revision (optional)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ vars.ACA_AUTO_RESTART == 'true' }}
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Restart the ACA app
        run: |
          az containerapp update \
            --name onetake-seo-ai \
            --resource-group ${{ vars.ACA_RESOURCE_GROUP }} \
            --image ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
